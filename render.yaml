services:
  - type: web
    name: spice-and-soul
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm --prefix server ci && npm --prefix client ci && npm --prefix client run build
    startCommand: npm --prefix server start
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN_SECRET
        generateValue: true
